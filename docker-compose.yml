version: '3.8'

services:
  # FastAPI Backend
  creditlens-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=lgb_model_step32.txt
      - FEATURE_COLUMNS_PATH=
      - LOG_LEVEL=INFO
    volumes:
      - ./lgb_model_step32.txt:/app/lgb_model_step32.txt:ro
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend (placeholder for future implementation)
  creditlens-frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - creditlens-api
    restart: unless-stopped

  # Redis for caching (optional)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - creditlens-api
      - creditlens-frontend
    restart: unless-stopped

volumes:
  redis_data:
